services:
  - type: web
    name: compare-tech-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # sync: false => la valeur se saisit dans le tableau de bord Render,
      # jamais dans ce fichier (qui est versionne).
      - key: DB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NODE_ENV
        value: production
